<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Karatech ELV · Smart Design Engine</title>
    <link href="https://fonts.googleapis.com/css2?family=Markazi+Text:wght@600;700&family=Vazirmatn:wght@300;400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --bg-dark: #04101f; --glass: rgba(16, 22, 33, 0.75); --border: rgba(0, 242, 255, 0.15);
            --accent-cyan: #00f2ff; --accent-indigo: #4d8bff; --accent-gold: #d4af37;
            --text: #fff; --muted: #8b8f99;
        }
        html, body { height: 100%; overflow: hidden; font-family: 'Vazirmatn', sans-serif; background: var(--bg-dark); color: var(--text); }

        /* هدر */
        .header { display: flex; justify-content: space-between; align-items: center; padding: 10px 20px; background: rgba(10, 20, 35, 0.9); border-bottom: 1px solid var(--border); height: 60px; flex-shrink: 0; }
        .brand { font-size: 1.2rem; font-weight: 700; }
        .brand span { color: var(--accent-cyan); }
        .header-actions { display: flex; gap: 15px; align-items: center; }
        .back-btn { color: var(--accent-indigo); text-decoration: none; font-size: 0.85rem; display: flex; align-items: center; gap: 8px; padding: 6px 12px; border: 1px solid rgba(77, 139, 255, 0.3); border-radius: 6px; }
        
        /* سوئیچ تغییر حالت */
        .mode-switch { display: flex; background: rgba(255,255,255,0.05); border-radius: 8px; padding: 4px; border: 1px solid rgba(255,255,255,0.1); }
        .mode-btn { padding: 6px 16px; border: none; background: transparent; color: var(--muted); border-radius: 6px; cursor: pointer; font-family: inherit; font-size: 0.85rem; transition: 0.3s; }
        .mode-btn.active { background: var(--accent-indigo); color: #fff; box-shadow: 0 0 10px rgba(77, 139, 255, 0.3); }

        /* چیدمان اصلی */
        .layout { display: flex; height: calc(100vh - 60px); overflow: hidden; }
        .sidebar { width: 300px; flex-shrink: 0; background: rgba(10, 20, 35, 0.6); backdrop-filter: blur(10px); border-left: 1px solid var(--border); padding: 20px; display: flex; flex-direction: column; gap: 20px; overflow-y: auto; }
        .canvas-area { flex: 1; background: #0a0d12; background-image: linear-gradient(rgba(77, 139, 255, 0.03) 1px, transparent 1px), linear-gradient(90deg, rgba(77, 139, 255, 0.03) 1px, transparent 1px); background-size: 20px 20px; position: relative; overflow: hidden; display: flex; justify-content: center; align-items: center; padding: 20px; }

        /* استایل‌های مشترک سایدبار */
        .panel-title { font-size: 1.1rem; color: var(--accent-cyan); border-bottom: 1px solid var(--border); padding-bottom: 8px; margin-bottom: 10px; }
        .input-box { width: 100%; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 8px; padding: 12px; color: #fff; font-family: inherit; font-size: 0.9rem; }
        .btn { width: 100%; background: linear-gradient(135deg, var(--accent-indigo), var(--accent-cyan)); color: #000; padding: 10px; border: none; border-radius: 8px; font-weight: 700; cursor: pointer; font-family: inherit; }
        .list-item { background: rgba(0,0,0,0.2); border: 1px dashed rgba(255,255,255,0.1); padding: 10px; border-radius: 8px; color: var(--muted); font-size: 0.85rem; cursor: pointer; margin-bottom: 8px; transition: 0.2s; }
        .list-item:hover { border-color: var(--accent-cyan); color: var(--accent-cyan); }

        /* حالت اول: گالری مدار */
        #modeGallery { display: none; flex-direction: column; height: 100%; }
        #modeGallery.active { display: flex; }
        .schematic-box { width: 100%; height: 100%; display: flex; justify-content: center; align-items: center; }
        .schematic-svg { max-width: 100%; max-height: 100%; height: auto; filter: drop-shadow(0 0 5px rgba(0,242,255,0.1)); }
        
        /* حالت دوم: درگ اند دراپ */
        #modeDragDrop { display: none; flex-direction: column; height: 100%; }
        #modeDragDrop.active { display: flex; }
        .comp-item { display: flex; align-items: center; gap: 10px; background: rgba(0,0,0,0.2); border: 1px solid rgba(255,255,255,0.1); padding: 10px; border-radius: 8px; cursor: grab; margin-bottom: 8px; color: #fff; font-size: 0.9rem; }
        .comp-item:active { cursor: grabbing; }
        .comp-item i { color: var(--accent-gold); }
        
        .drop-zone { width: 100%; height: 100%; border: 2px dashed rgba(255,255,255,0.1); border-radius: 12px; position: relative; overflow: hidden; }
        .dropped-element { position: absolute; background: rgba(16, 22, 33, 0.9); border: 1px solid var(--accent-cyan); padding: 15px; border-radius: 8px; cursor: move; color: #fff; font-size: 0.8rem; display: flex; flex-direction: column; align-items: center; gap: 5px; box-shadow: 0 0 15px rgba(0,242,255,0.2); user-select: none; }
        .dropped-element i { font-size: 1.5rem; color: var(--accent-cyan); }
    </style>
</head>
<body>
    <div class="header">
        <div class="brand">KARATECH <span>ELV</span> · Smart Engine</div>
        <div class="header-actions">
            <div class="mode-switch">
                <button class="mode-btn active" onclick="switchMode('modeGallery', this)">حالت جستجو</button>
                <button class="mode-btn" onclick="switchMode('modeDragDrop', this)">حالت طراحی</button>
            </div>
            <a href="../academy/design.html" class="back-btn"><i class="fas fa-arrow-right"></i> بازگشت</a>
        </div>
    </div>

    <div class="layout">
        <!-- سایدبار حالت اول -->
        <div class="sidebar" id="modeGallery">
            <div class="panel-title"><i class="fas fa-search"></i> جستجوی مدار هوشمند</div>
            <input type="text" class="input-box" id="searchInput" placeholder="مثلاً: استار دلتا" oninput="searchCircuit()">
            <button class="btn" onclick="searchCircuit()"><i class="fas fa-bolt"></i> رسم مدار</button>
            
            <div style="margin-top: 20px;">
                <div class="panel-title">مدارهای آماده:</div>
                <div class="list-item" onclick="loadCircuit('dol')">استار استاپ مستقیم (DOL)</div>
                <div class="list-item" onclick="loadCircuit('star-delta')">استار دلتا (Star-Delta)</div>
                <div class="list-item" onclick="loadCircuit('reverse')">تغییر جهت موتور (Forward/Reverse)</div>
            </div>
        </div>

        <!-- سایدبار حالت دوم -->
        <div class="sidebar" id="modeDragDrop">
            <div class="panel-title"><i class="fas fa-toolbox"></i> کتابخانه قطعات</div>
            <div class="comp-item" draggable="true" ondragstart="dragStart(event, 'contactor', 'fa fa-bolt')">
                <i class="fas fa-bolt"></i> کنتاکتور (K1)
            </div>
            <div class="comp-item" draggable="true" ondragstart="dragStart(event, 'start_btn', 'fa fa-play')">
                <i class="fas fa-play"></i> شستی استارت (NO)
            </div>
            <div class="comp-item" draggable="true" ondragstart="dragStart(event, 'stop_btn', 'fa fa-stop')">
                <i class="fas fa-stop"></i> شستی استاپ (NC)
            </div>
            <div class="comp-item" draggable="true" ondragstart="dragStart(event, 'relay', 'fa fa-temperature-high')">
                <i class="fas fa-temperature-high"></i> رله حرارتی (F1)
            </div>
            <div class="comp-item" draggable="true" ondragstart="dragStart(event, 'fuse', 'fa fa-shield-alt')">
                <i class="fas fa-shield-alt"></i> فیوز (F2)
            </div>
            <div class="comp-item" draggable="true" ondragstart="dragStart(event, 'coil', 'fa fa-circle-notch')">
                <i class="fas fa-circle-notch"></i> کویل (Coil)
            </div>
        </div>

        <!-- فضای بوم طراحی -->
        <div class="canvas-area">
            <!-- کانوس حالت اول -->
            <div class="schematic-box" id="galleryCanvas">
                <svg class="schematic-svg" id="svgCanvas" viewBox="0 0 300 400" preserveAspectRatio="xMidYMid meet">
                    <text x="150" y="200" fill="#8b8f99" font-size="16" text-anchor="middle" font-family="Vazirmatn">منتظر انتخاب مدار...</text>
                </svg>
            </div>

            <!-- کانوس حالت دوم -->
            <div class="drop-zone" id="dropZone" ondrop="dropElement(event)" ondragover="allowDrop(event)"></div>
        </div>
    </div>

    <script>
        // ۱. منطق تغییر حالت
        function switchMode(modeId, btn) {
            document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            
            document.querySelectorAll('.sidebar').forEach(s => s.style.display = 'none');
            document.getElementById(modeId).style.display = 'flex';
            
            document.getElementById('galleryCanvas').style.display = (modeId === 'modeGallery') ? 'flex' : 'none';
            document.getElementById('dropZone').style.display = (modeId === 'modeDragDrop') ? 'block' : 'none';
        }

        // ۲. منطق حالت اول: گالری مدار
        function searchCircuit() {
            let val = document.getElementById('searchInput').value.toLowerCase();
            if (val.includes('دلتا')) loadCircuit('star-delta');
            else if (val.includes('مستقیم') || val.includes('dol')) loadCircuit('dol');
            else if (val.includes('جهت') || val.includes('reverse')) loadCircuit('reverse');
            else if(val.trim() !== '') {
                document.getElementById('svgCanvas').innerHTML = `<text x="150" y="200" fill="#e74c3c" font-size="14" text-anchor="middle">مداری یافت نشد</text>`;
            }
        }

        function loadCircuit(type) {
            const svg = document.getElementById('svgCanvas');
            svg.setAttribute('viewBox', '0 0 300 400');
            if (type === 'dol') {
                svg.innerHTML = `
                    <text x="150" y="30" fill="#00f2ff" font-size="14" text-anchor="middle">DOL Starter Control Diagram</text>
                    <line x1="50" y1="50" x2="50" y2="380" stroke="#fff" stroke-width="2"/>
                    <line x1="250" y1="50" x2="250" y2="380" stroke="#fff" stroke-width="2"/>
                    
                    <rect x="40" y="70" width="20" height="30" fill="none" stroke="#d4af37" stroke-width="2"/>
                    <text x="70" y="90" fill="#d4af37" font-size="12">F1</text>
                    
                    <line x1="40" y1="130" x2="60" y2="160" stroke="#00f2ff" stroke-width="2"/>
                    <text x="70" y="150" fill="#00f2ff" font-size="12">K1</text>
                    
                    <rect x="40" y="180" width="20" height="30" fill="none" stroke="#f39c12" stroke-width="2"/>
                    <line x1="40" y1="180" x2="60" y2="210" stroke="#f39c12" stroke-width="2"/>
                    <text x="70" y="200" fill="#f39c12" font-size="12">F2</text>
                    
                    <line x1="40" y1="240" x2="60" y2="270" stroke="#e74c3c" stroke-width="2"/>
                    <text x="70" y="260" fill="#e74c3c" font-size="12">S0 (Stop)</text>
                    
                    <line x1="40" y1="290" x2="60" y2="320" stroke="#2ecc71" stroke-width="2"/>
                    <text x="70" y="310" fill="#2ecc71" font-size="12">S1 (Start)</text>
                    
                    <circle cx="200" cy="350" r="20" fill="none" stroke="#00f2ff" stroke-width="2"/>
                    <text x="230" y="355" fill="#00f2ff" font-size="12">K1 Coil</text>
                    
                    <line x1="50" y1="320" x2="200" y2="320" stroke="#fff" stroke-width="2"/>
                    <line x1="200" y1="320" x2="200" y2="330" stroke="#fff" stroke-width="2"/>
                    <line x1="200" y1="370" x2="250" y2="370" stroke="#fff" stroke-width="2"/>
                `;
            } else {
                svg.innerHTML = `<text x="150" y="200" fill="#f39c12" font-size="14" text-anchor="middle">در حال آماده‌سازی...</text>`;
            }
        }

        // ۳. منطق حالت دوم: درگ اند دراپ
        function allowDrop(e) { e.preventDefault(); }
        
        function dragStart(e, type, iconClass) {
            e.dataTransfer.setData("type", type);
            e.dataTransfer.setData("icon", iconClass);
        }

        function dropElement(e) {
            e.preventDefault();
            const type = e.dataTransfer.getData("type");
            const iconClass = e.dataTransfer.getData("icon");
            const zone = document.getElementById('dropZone');
            
            // محاسبه موقعیت ماوس نسبت به بوم
            const rect = zone.getBoundingClientRect();
            const x = e.clientX - rect.left - 25; // وسط چین کردن تقریبی
            const y = e.clientY - rect.top - 15;
            
            const el = document.createElement('div');
            el.className = 'dropped-element';
            el.style.left = x + 'px';
            el.style.top = y + 'px';
            el.innerHTML = `<i class="fas ${iconClass}"></i><span>${type}</span>`;
            
            // قابلیت جابجایی
            let isDragging = false, offsetX = 0, offsetY = 0;
            
            el.addEventListener('mousedown', function(e) {
                isDragging = true;
                offsetX = e.clientX - el.offsetLeft;
                offsetY = e.clientY - el.offsetTop;
                el.style.zIndex = 1000;
            });
            
            document.addEventListener('mousemove', function(e) {
                if(isDragging) {
                    el.style.left = (e.clientX - offsetX) + 'px';
                    el.style.top = (e.clientY - offsetY) + 'px';
                }
            });
            
            document.addEventListener('mouseup', function() { isDragging = false; });
            
            zone.appendChild(el);
        }
    </script>
</body>
</html>
