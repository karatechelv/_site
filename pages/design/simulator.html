<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Karatech ELV · Web Simulator</title>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --bg-dark: #04101f; --glass: rgba(16, 22, 33, 0.75); --border: rgba(0, 242, 255, 0.15);
            --cyan: #00f2ff; --indigo: #4d8bff; --text: #fff; --muted: #8b8f99;
        }
        html, body { height: 100%; overflow: hidden; font-family: 'Vazirmatn', sans-serif; background: var(--bg-dark); color: var(--text); }

        .header { display: flex; justify-content: space-between; align-items: center; padding: 10px 20px; background: rgba(10, 20, 35, 0.9); border-bottom: 1px solid var(--border); height: 60px; flex-shrink: 0; }
        .brand { font-size: 1.2rem; font-weight: 700; }
        .brand span { color: var(--cyan); }
        .back-btn { color: var(--indigo); text-decoration: none; font-size: 0.85rem; display: flex; align-items: center; gap: 8px; padding: 6px 12px; border: 1px solid rgba(77, 139, 255, 0.3); border-radius: 6px; }

        .main-layout { display: flex; flex-direction: column; height: calc(100vh - 60px); padding: 15px; gap: 15px; }
        
        .sim-tabs { display: flex; gap: 10px; flex-wrap: wrap; }
        .sim-tab-btn { padding: 8px 16px; background: rgba(255,255,255,0.05); border: 1px solid var(--border); color: var(--muted); border-radius: 8px; cursor: pointer; font-family: inherit; font-size: 0.85rem; transition: 0.3s; }
        .sim-tab-btn.active { background: var(--indigo); color: #fff; border-color: var(--indigo); box-shadow: 0 0 10px rgba(77, 139, 255, 0.3); }

        .sim-container { flex: 1; background: rgba(16, 22, 33, 0.6); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; box-shadow: 0 0 20px rgba(0, 242, 255, 0.05); position: relative; }
        
        .iframe-loader { position: absolute; inset: 0; display: flex; justify-content: center; align-items: center; color: var(--muted); flex-direction: column; gap: 10px; background: var(--bg-dark); z-index: 10; }
        .spinner { border: 3px solid rgba(0, 242, 255, 0.2); border-top: 3px solid var(--cyan); border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        iframe { width: 100%; height: 100%; border: none; position: absolute; inset: 0; }
    </style>
</head>
<body>
    <div class="header">
        <div class="brand">KARATECH <span>ELV</span> · Web Simulator</div>
        <a href="../academy/design.html" class="back-btn"><i class="fas fa-arrow-right"></i> بازگشت به طراحی</a>
    </div>

    <div class="main-layout">
        <div class="sim-tabs">
            <button class="sim-tab-btn active" onclick="switchSim('power', this)">شبیه‌ساز فرمان و منطق (CircuitVerse)</button>
            <button class="sim-tab-btn" onclick="switchSim('elec', this)">شبیه‌ساز الکترونیک (Falstad)</button>
        </div>
        
        <div class="sim-container">
            <div class="iframe-loader" id="loader">
                <div class="spinner"></div>
                <span id="loaderText">در حال بارگذاری موتور شبیه‌سازی...</span>
            </div>
            <!-- جایگزینی سایت خاموش شده با CircuitVerse -->
            <iframe id="simFrame" src="https://circuitverse.org/simulator" onload="hideLoader()"></iframe>
        </div>
    </div>

    <script>
        function hideLoader() {
            document.getElementById('loader').style.display = 'none';
        }

        function switchSim(type, btn) {
            document.querySelectorAll('.sim-tab-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            
            const frame = document.getElementById('simFrame');
            const loader = document.getElementById('loader');
            const loaderText = document.getElementById('loaderText');
            
            loader.style.display = 'flex';
            
            if(type === 'power') {
                frame.src = 'https://circuitverse.org/simulator';
                loaderText.textContent = 'در حال بارگذاری شبیه‌ساز فرمان و منطق...';
            } else if(type === 'elec') {
                frame.src = 'https://www.falstad.com/circuit/circuitjs.html';
                loaderText.textContent = 'در حال بارگذاری شبیه‌ساز الکترونیک...';
            }
        }
    </script>
</body>
</html>
