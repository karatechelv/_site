    <title>Karatech ELV · کنترل کیفیت</title>

    <style>
        :root {
            --text-main: #ffffff;
            --text-muted: #8b8f99;
            --transition: 0.4s cubic-bezier(0.25, 0.8, 0.25, 1);
            --accent-indigo: #4d8bff;
            --accent-cyan: #00f2ff;
            --accent-gold: #d4af37;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Vazirmatn', sans-serif;
            color: var(--text-main);
            min-height: 100vh;
            background: radial-gradient(ellipse 80% 80% at 50% 50%, #0a1a2e 0%, #04101f 40%, #000000 80%);
            overflow-x: hidden;
            direction: rtl;
        }

        body::after {
            content: ''; position: fixed; inset: 0;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.5'/%3E%3C/svg%3E");
            opacity: 0.04; pointer-events: none; z-index: 9999; mix-blend-mode: overlay;
        }

        /* ===== هدر ===== */
        .header {
            display: flex; justify-content: space-between; align-items: center;
            padding: 15px 40px; background: rgba(10, 20, 35, 0.6); backdrop-filter: blur(15px);
            border-bottom: 1px solid rgba(77, 139, 255, 0.15); position: sticky; top: 0; z-index: 100;
        }
        .header-left { display: flex; align-items: center; gap: 15px; }
        .brand { font-family: 'Markazi Text', sans-serif; font-size: 1.6rem; font-weight: 700; letter-spacing: 1px; }
        .brand span { color: var(--accent-indigo); font-style: italic; font-weight: 500; }
        
        .breadcrumb { display: flex; align-items: center; gap: 10px; font-size: 1rem; color: var(--text-muted); }
        .breadcrumb span { color: var(--accent-cyan); }

        .datetime-widget { display: flex; flex-direction: column; align-items: center; font-size: 0.85rem; color: var(--text-muted); font-family: monospace; }
        .time-display { color: var(--accent-cyan); font-weight: 600; font-size: 1rem; }
        
        .header-actions { display: flex; align-items: center; gap: 16px; }
        .back-btn { 
            background: transparent; border: 1px solid rgba(77, 139, 255, 0.3); color: var(--accent-indigo); 
            padding: 8px 16px; border-radius: 6px; cursor: pointer; font-weight: 600; font-size: 0.85rem; transition: 0.3s; 
            text-decoration: none; display: flex; align-items: center; gap: 8px;
        }
        .back-btn i { transform: rotate(180deg); }
        .back-btn:hover { background: rgba(77, 139, 255, 0.1); box-shadow: 0 0 15px rgba(77, 139, 255, 0.2); }
        .lang-switch { display: flex; gap: 8px; }
