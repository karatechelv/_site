    function toggleAccordion(elem) {
        const body = elem.nextElementSibling;
        if (body.style.maxHeight && body.style.maxHeight !== '0px') {
            body.style.maxHeight = '0';
            elem.classList.remove('active');
        } else {
            body.style.maxHeight = body.scrollHeight + 'px';
            elem.classList.add('active');
        }
    }

    function loadChecklist(type) {
        document.querySelectorAll('.panel-btn').forEach(btn => btn.classList.remove('active'));
        event.target.classList.add('active');

        const container = document.getElementById('checklistContainer');
        container.innerHTML = '';
        
        qcData[type].forEach((cat, catIndex) => {
            const catTitle = currentLang === 'fa' ? cat.cat_fa : cat.cat_en;
            let itemsHTML = '';
            
            cat.items.forEach(item => {
                const itemText = currentLang === 'fa' ? item.t_fa : item.t_en;
                const critText = item.crit === 'critical' ? (currentLang === 'fa' ? 'بحرانی' : 'Critical') : item.crit === 'general' ? (currentLang === 'fa' ? 'کلی' : 'General') : (currentLang === 'fa' ? 'جزئی' : 'Minor');
                const rowId = `${type}-${catIndex}-${item.id}`;
                
                itemsHTML += `
                    <tr class="check-row" data-id="${rowId}">
                        <td style="width: 40px; text-align: center;">${item.id}</td>
                        <td><a href="inspection-${item.id}.html" class="item-link"><i class="fas fa-link"></i> ${itemText}</a></td>
                        <td style="width: 80px; text-align: center;"><span class="crit-badge crit-${item.crit}">${critText}</span></td>
                        <td style="width: 180px;">
                            <div class="action-group">
                                <button class="action-btn btn-approve" onclick="setItemState('${rowId}', 'approved')" title="تایید"><i class="fas fa-check"></i></button>
                                <button class="action-btn btn-reject" onclick="setItemState('${rowId}', 'rejected')" title="عدم تایید"><i class="fas fa-times"></i></button>
                                <button class="action-btn btn-na" onclick="setItemState('${rowId}', 'na')" title="موضوعی ندارد"><i class="fas fa-minus"></i></button>
                                <input type="text" class="ncr-input" placeholder="NCR No." id="ncr-${rowId}">
                            </div>
                        </td>
                    </tr>
                `;
            });

            const accordionHTML = `
                <div class="accordion-item">
                    <div class="accordion-header" onclick="toggleAccordion(this)">
                        <span>${catTitle}</span>
                        <i class="fas fa-chevron-down arrow"></i>
                    </div>
                    <div class="accordion-body">
                        <table class="check-table">
                            <thead><tr><th>#</th><th>${currentLang === 'fa' ? 'مورد بازرسی' : 'Item'}</th><th>${currentLang === 'fa' ? 'اهمیت' : 'Importance'}</th><th>${currentLang === 'fa' ? 'اقدام' : 'Action'}</th></tr></thead>
                            <tbody>${itemsHTML}</tbody>
                        </table>
                    </div>
                </div>
            `;
            container.innerHTML += accordionHTML;
        });

        const firstHeader = container.querySelector('.accordion-header');
        if(firstHeader) toggleAccordion(firstHeader);
        updateProgress();
    }

    function setItemState(id, state) {
        const row = document.querySelector(`tr[data-id="${id}"]`);
        const ncrInput = document.getElementById(`ncr-${id}`);
        const btnApprove = row.querySelector('.btn-approve');
        const btnReject = row.querySelector('.btn-reject');
        const btnNA = row.querySelector('.btn-na');

        btnApprove.classList.remove('active');
        btnReject.classList.remove('active');
        btnNA.classList.remove('active');
        row.classList.remove('approved', 'rejected', 'na');
        ncrInput.classList.remove('show');

        if (state === 'approved') {
            btnApprove.classList.add('active');
            row.classList.add('approved');
        } else if (state === 'rejected') {
            btnReject.classList.add('active');
            row.classList.add('rejected');
            ncrInput.classList.add('show');
            ncrInput.focus();
        } else if (state === 'na') {
            btnNA.classList.add('active');
            row.classList.add('na');
        }
        updateProgress();
    }

    function updateProgress() {
        const rows = document.querySelectorAll('.check-row');
        let approved = 0, rejected = 0, na = 0, pending = 0;
        rows.forEach(row => {
            if (row.classList.contains('approved')) approved++;
            else if (row.classList.contains('rejected')) rejected++;
            else if (row.classList.contains('na')) na++;
            else pending++;
        });
        document.getElementById('statApproved').textContent = approved;
        document.getElementById('statRejected').textContent = rejected;
        document.getElementById('statNA').textContent = na;
        document.getElementById('statPending').textContent = pending;
        const percent = rows.length > 0 ? Math.round(((approved + rejected + na) / rows.length) * 100) : 0;
        document.getElementById('progressFill').style.width = percent + '%';
        document.getElementById('progressPercent').textContent = percent + '%';
    }

    function generateReport() {
        const projectName = document.getElementById('projectNameInput').value || (currentLang === 'fa' ? 'نامشخص' : 'N/A');
        const activePanelBtn = document.querySelector('.panel-btn.active');
        const panelType = activePanelBtn ? activePanelBtn.textContent : 'N/A';
        const date = new Date().toLocaleDateString(currentLang === 'fa' ? 'fa-IR' : 'en-US');
        
        let tableRows = '';
        const rows = document.querySelectorAll('.check-row');
        
        rows.forEach(row => {
            // اگر "موضوعی ندارد" انتخاب شده بود، آن ردیف در PDF چاپ نشود
            if (row.classList.contains('na')) return; 

            const id = row.querySelector('td').innerText;
            const text = row.querySelector('.item-link').innerText.trim();
            const crit = row.querySelector('.crit-badge').innerText;
            const btnApprove = row.querySelector('.btn-approve');
            const btnReject = row.querySelector('.btn-reject');
            const ncrInput = row.querySelector('.ncr-input');
            
            let status = currentLang === 'fa' ? 'در انتظار' : 'Pending';
            let statusColor = '#f39c12';
            let ncrNo = '';
            
            if (btnApprove.classList.contains('active')) {
                status = currentLang === 'fa' ? 'تایید' : 'Approved';
                statusColor = '#2ecc71';
            } else if (btnReject.classList.contains('active')) {
                status = currentLang === 'fa' ? 'عدم تایید' : 'Rejected';
                statusColor = '#e74c3c';
                ncrNo = ncrInput.value || '-';
            }
            
            tableRows += `<tr><td style="border: 1px solid #ddd; padding: 8px; text-align: center;">${id}</td><td style="border: 1px solid #ddd; padding: 8px;">${text}</td><td style="border: 1px solid #ddd; padding: 8px; text-align: center;">${crit}</td><td style="border: 1px solid #ddd; padding: 8px; text-align: center; color: ${statusColor}; font-weight: bold;">${status}</td><td style="border: 1px solid #ddd; padding: 8px; text-align: center;">${ncrNo}</td></tr>`;
        });

        const reportHTML = `
            <html lang="${currentLang}" dir="${currentLang === 'fa' ? 'rtl' : 'ltr'}">
            <head>
                <meta charset="UTF-8"><title>QC Report - ${projectName}</title>
                <style>
                    body { font-family: ${currentLang === 'fa' ? 'Vazirmatn, sans-serif' : 'Arial, sans-serif'}; padding: 40px; color: #000; }
                    h1 { text-align: center; color: #004085; border-bottom: 2px solid #004085; padding-bottom: 15px; margin-bottom: 30px; }
                    .header-table { width: 100%; border-collapse: collapse; margin-bottom: 20px; }
                    .header-table td { padding: 8px; border: 1px solid #ccc; }
                    .header-table strong { color: #333; }
                    table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 14px; }
                    th { background: #f2f2f2; padding: 10px; border: 1px solid #ddd; text-align: center; }
                    .signatures { margin-top: 50px; width: 100%; display: flex; justify-content: space-between; }
                    .sig-box { width: 45%; border-top: 1px solid #000; padding-top: 10px; text-align: center; }
                    @media print { button { display: none; } }
                </style>
            </head>
            <body>
                <h1>${currentLang === 'fa' ? 'فرم بازرسی نهایی کنترل کیفیت' : 'Final Quality Control Inspection Report'}</h1>
                <table class="header-table">
                    <tr><td><strong>${currentLang === 'fa' ? 'نام پروژه:' : 'Project Name:'}</strong> ${projectName}</td><td><strong>${currentLang === 'fa' ? 'نوع تابلو:' : 'Panel Type:'}</strong> ${panelType}</td><td><strong>${currentLang === 'fa' ? 'تاریخ:' : 'Date:'}</strong> ${date}</td></tr>
                </table>
                <table>
                    <thead><tr><th>#</th><th>${currentLang === 'fa' ? 'مورد بازرسی' : 'Inspection Item'}</th><th>${currentLang === 'fa' ? 'درجه اهمیت' : 'Criticality'}</th><th>${currentLang === 'fa' ? 'نتیجه' : 'Result'}</th><th>${currentLang === 'fa' ? 'شماره عدم انطباق' : 'NCR No.'}</th></tr></thead>
                    <tbody>${tableRows}</tbody>
                </table>
                <div class="signatures">
                    <div class="sig-box">${currentLang === 'fa' ? 'نام و امضاء بازرس کنترل کیفیت' : 'QC Inspector Signature'}</div>
                    <div class="sig-box">${currentLang === 'fa' ? 'نام و امضاء سرپرست کنترل کیفیت' : 'QC Supervisor Signature'}</div>
                </div>
                <div style="text-align: center; margin-top: 30px;">
                    <button onclick="window.print()" style="padding: 10px 20px; background: #004085; color: #fff; border: none; border-radius: 5px; cursor: pointer; font-size: 16px;">${currentLang === 'fa' ? 'چاپ / ذخیره PDF' : 'Print / Save as PDF'}</button>
                </div>
            </body>
            </html>
        `;
        const reportWindow = window.open('', '_blank');
        reportWindow.document.write(reportHTML);
        reportWindow.document.close();
    }

    // راه‌اندازی اولیه
    loadChecklist('lv_final');
</script>
